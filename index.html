<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KomikRoll</title>
  <meta name="description" content="Baca manga, manhwa, dan manhua bahasa Indonesia dengan nyaman di HP." />
  <meta name="theme-color" content="#F7F5F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KomikRoll" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://serveproxy.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet" />
  <style>
    /*
      Design decisions (one line each):
      - Palette: warm paper neutrals + one vermilion "ink" accent, so cover art stays the loudest color on screen.
      - Accent is used only for the primary action, active tab/filter, and reading progress.
      - Headings: Bricolage Grotesque, chunky like comic lettering, gives the brand a voice; body uses the
        system font so long lists render instantly and feel native on phones.
      - Identity motif: big ink rank numerals + the "Roll" accent in the wordmark.
      - Shadow only on the two floating bars (tab bar, reader controls) to mark that they sit above content.
      - Motion: hover/press feedback and skeleton shimmer only (both off under reduced motion).
    */
    :root {
      color-scheme: light;
      --bg: #F7F5F2;
      --surface: #FFFFFF;
      --surface-2: #EFECE7;
      --border: #E3DED6;
      --text: #1C1A17;
      --muted: #5F5A52;
      --accent: #C2410C;
      --accent-text: #9A3412;
      --on-accent: #FFFFFF;
      --accent-soft: #FCE7DA;
      --shimmer: rgba(255, 255, 255, 0.55);
      --overlay: rgba(28, 26, 23, 0.45);
      --radius-s: 6px;
      --radius-m: 10px;
      --radius-l: 16px;
      --header-h: 56px;
      --tabbar-h: 64px;
      --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #121110;
        --surface: #1B1A18;
        --surface-2: #262421;
        --border: #2E2B27;
        --text: #EDEAE5;
        --muted: #A8A29A;
        --accent: #FB8A4C;
        --accent-text: #FDBA8C;
        --on-accent: #1C0D04;
        --accent-soft: #3A2114;
        --shimmer: rgba(255, 255, 255, 0.06);
        --overlay: rgba(0, 0, 0, 0.6);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121110;
      --surface: #1B1A18;
      --surface-2: #262421;
      --border: #2E2B27;
      --text: #EDEAE5;
      --muted: #A8A29A;
      --accent: #FB8A4C;
      --accent-text: #FDBA8C;
      --on-accent: #1C0D04;
      --accent-soft: #3A2114;
      --shimmer: rgba(255, 255, 255, 0.06);
      --overlay: rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 12px); }
    /* Safety net: nothing may ever make the page pan sideways on a phone. `clip` (not `hidden`)
       keeps sticky headers working and does not create a second scroll container. */
    html, body { overflow-x: clip; max-width: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 15px;
      -webkit-tap-highlight-color: transparent;
    }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; color: inherit; }
    a[href], button, summary, select, label[for] { cursor: pointer; }
    button:disabled, [aria-disabled="true"] { cursor: not-allowed; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-s); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    svg.icon { width: 22px; height: 22px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Header ---------- */
    .site-header {
      position: sticky; top: 0; z-index: 40;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }
    .header-inner {
      max-width: 1120px; margin: 0 auto;
      height: var(--header-h);
      display: flex; align-items: center; gap: 8px;
      padding: 0 8px 0 16px;
    }
    .brand {
      font-family: var(--font-display);
      font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em;
      margin-right: auto;
      padding: 6px 0;
    }
    .brand span { color: var(--accent); }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: var(--radius-m);
      background: transparent; border: 0; color: var(--text);
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn:active { transform: scale(0.94); }
    .desktop-nav { display: none; }

    /* ---------- Bottom tab bar (mobile) ---------- */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: var(--surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar ul { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
    .tab {
      height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 0.72rem; font-weight: 600; color: var(--muted);
    }
    .tab:active { opacity: 0.7; }
    .tab[aria-current="page"] { color: var(--accent-text); }
    .tab[aria-current="page"] svg { stroke-width: 2.5; }

    main {
      max-width: 1120px; margin: 0 auto;
      padding: 16px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 32px);
      min-height: 60vh;
    }
    main:focus { outline: none; }

    /* ---------- Typography ---------- */
    .page-title {
      font-family: var(--font-display);
      font-weight: 800; font-size: 1.6rem; line-height: 1.15; letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .section { margin-bottom: 32px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .section-title { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -0.01em; }
    .muted { color: var(--muted); }
    .small { font-size: 0.82rem; }
    .text-link { color: var(--accent-text); font-weight: 600; font-size: 0.9rem; padding: 10px 0; display: inline-block; }
    .text-link:hover { text-decoration: underline; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 18px;
      border-radius: var(--radius-m);
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      font-weight: 600; font-size: 0.92rem;
      transition: background-color 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
      min-width: 0; max-width: 100%;
    }
    /* Long labels (chapter titles) truncate instead of widening the button past the screen. */
    .btn > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .btn:hover { border-color: var(--muted); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; transform: none; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
    .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent-text); }
    .btn-block { width: 100%; }

    /* ---------- Segmented control & chips ---------- */
    .segmented {
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      background: var(--surface-2); border-radius: var(--radius-m); padding: 4px; gap: 4px;
      margin-bottom: 12px;
    }
    .segmented a {
      min-height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 7px; font-weight: 600; font-size: 0.9rem; color: var(--muted);
    }
    .segmented a:hover { color: var(--text); }
    .segmented a[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }

    .chip-row {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      margin: 0 -16px 16px; padding: 2px 16px 4px;
      scroll-snap-type: x proximity;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; scroll-snap-align: start;
      min-width: 44px; height: 40px; padding: 0 14px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-s); border: 1px solid var(--border);
      background: var(--surface); font-weight: 600; font-size: 0.88rem;
    }
    .chip:hover { border-color: var(--muted); }
    .chip[aria-current="page"] { background: var(--text); border-color: var(--text); color: var(--bg); }
    .tag {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: var(--radius-s);
      background: var(--surface-2); color: var(--muted);
      font-size: 0.78rem; font-weight: 600;
    }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ---------- Cards / grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(102px, 1fr));
      gap: 18px 12px;
    }
    .card { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .card-link { display: flex; flex-direction: column; gap: 8px; border-radius: var(--radius-m); }
    .card-link:hover .card-title { color: var(--accent-text); }
    .card-link:active .cover { transform: scale(0.98); }
    .cover {
      position: relative; aspect-ratio: 2 / 3; border-radius: var(--radius-m); overflow: hidden;
      background: var(--surface-2); transition: transform 0.1s;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.25s; }
    .cover.loaded img { opacity: 1; }
    .cover.loaded::after { display: none; }
    .cover-fallback {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; color: var(--muted);
    }
    .cover.failed .cover-fallback, .cover.empty .cover-fallback { display: flex; }
    .cover.failed::after, .cover.empty::after { display: none; }
    .type-label {
      position: absolute; left: 6px; bottom: 6px;
      padding: 1px 7px; border-radius: 4px;
      background: rgba(18, 17, 16, 0.78); color: #F3F0EB;
      font-size: 0.68rem; font-weight: 700;
    }
    .card-title {
      font-size: 0.86rem; font-weight: 600; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .chapter-chip {
      align-self: flex-start;
      display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px;
      border-radius: var(--radius-s); background: var(--surface-2);
      font-size: 0.78rem; font-weight: 600; color: var(--muted);
      position: relative;
    }
    /* Larger invisible hit area so the 32px chip still meets the 44px tap target. */
    .chapter-chip::before { content: ""; position: absolute; inset: -6px -4px; }
    .chapter-chip:hover { color: var(--accent-text); }

    /* Horizontal rail (continue reading) */
    .rail {
      display: grid; grid-auto-flow: column; grid-auto-columns: 112px; gap: 12px;
      overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory;
      margin: 0 -16px; padding: 0 16px 4px;
    }
    .rail::-webkit-scrollbar { display: none; }
    .rail > * { scroll-snap-align: start; }

    /* ---------- Ranked list (Populer) ---------- */
    .rank-list { list-style: none; display: grid; gap: 4px; }
    .rank-item {
      display: grid; grid-template-columns: 40px 52px minmax(0, 1fr); align-items: center; gap: 12px;
      padding: 8px 8px 8px 0; border-radius: var(--radius-m);
    }
    .rank-item:hover { background: var(--surface); }
    .rank-num {
      font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1;
      text-align: center; color: var(--muted); font-variant-numeric: tabular-nums;
    }
    .rank-item.top3 .rank-num { color: var(--accent-text); }
    .rank-item .cover { border-radius: var(--radius-s); }
    .rank-item .cover-fallback { font-size: 1.1rem; }
    .rank-title { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* ---------- History list ---------- */
    .row-list { list-style: none; display: grid; gap: 4px; }
    .row-item { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; }
    .row-item .cover { border-radius: var(--radius-s); }
    .row-item .cover-fallback { font-size: 1rem; }
    .row-main { min-width: 0; }
    .row-main a { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 0; }

    /* ---------- Search ---------- */
    .search-field { position: relative; margin-bottom: 16px; }
    .search-field label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }
    .input {
      width: 100%; height: 48px; padding: 0 14px 0 44px;
      border-radius: var(--radius-m); border: 1px solid var(--border);
      background: var(--surface); font-size: 16px;
    }
    .input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
    .input-icon { position: absolute; left: 13px; bottom: 13px; color: var(--muted); pointer-events: none; }
    .input-icon svg.icon { width: 20px; height: 20px; }
    .input.plain { padding-left: 14px; height: 44px; font-size: 16px; }

    /* ---------- Detail ---------- */
    .detail-hero { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 16px; }
    .detail-hero .cover { border-radius: var(--radius-m); }
    .detail-title { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
    .alt-title { color: var(--muted); font-size: 0.86rem; margin-top: 4px; overflow-wrap: anywhere; }
    .detail-meta { margin-top: 10px; }
    .detail-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 16px; }
    .synopsis { color: var(--muted); font-size: 0.92rem; white-space: pre-line; overflow-wrap: anywhere; }
    .synopsis.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .genres { margin: 12px 0 4px; }

    .chapter-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 8px; }
    .chapter-list { list-style: none; border-top: 1px solid var(--border); }
    .chapter-list li { border-bottom: 1px solid var(--border); }
    .chapter-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 52px; padding: 8px 4px;
    }
    .chapter-row:hover { background: var(--surface); }
    .chapter-row .ch-name { font-weight: 600; }
    .chapter-row.read .ch-name { color: var(--muted); font-weight: 500; }
    .ch-state { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
    .chapter-row.current .ch-state { color: var(--accent-text); font-weight: 700; }

    /* ---------- Pagination ---------- */
    .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 28px; flex-wrap: wrap; }
    .page-btn {
      min-width: 44px; height: 44px; padding: 0 12px;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      border-radius: var(--radius-m); border: 1px solid var(--border); background: var(--surface);
      font-weight: 600; font-size: 0.92rem; font-variant-numeric: tabular-nums;
    }
    a.page-btn:hover { border-color: var(--muted); }
    a.page-btn:active { transform: scale(0.96); }
    .page-btn[aria-current="page"] { background: var(--text); border-color: var(--text); color: var(--bg); }
    .page-btn[aria-disabled="true"] { opacity: 0.4; }
    .page-gap { color: var(--muted); padding: 0 2px; }
    .page-label { flex-basis: 100%; text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

    /* ---------- States ---------- */
    .state {
      text-align: center; padding: 48px 20px; border-radius: var(--radius-l);
      background: var(--surface); border: 1px dashed var(--border);
    }
    .state h2 { font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
    .state p { color: var(--muted); font-size: 0.9rem; max-width: 34ch; margin: 0 auto 16px; }
    .state .btn { margin: 0 4px; }

    .sk { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--radius-s); }
    .sk::after, .cover::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, var(--shimmer), transparent);
      transform: translateX(-100%);
      animation: shimmer 1.3s ease-in-out infinite;
    }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .sk-line { height: 12px; margin-top: 8px; }
    .sk-title { height: 26px; width: 55%; margin-bottom: 14px; }
    .sk-cover { aspect-ratio: 2 / 3; border-radius: var(--radius-m); }

    /* ---------- Reader ---------- */
    body.reading .site-header, body.reading .tabbar { display: none; }
    body.reading main { max-width: none; padding: 0 0 calc(80px + env(safe-area-inset-bottom)); }
    .reader-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 45;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
      transition: transform 0.2s ease;
    }
    .reader-top-inner { max-width: 820px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
    .reader-heading { min-width: 0; flex: 1; }
    .reader-heading .comic-name { font-size: 0.78rem; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .reader-heading h1 { font-size: 0.98rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .progress { position: absolute; left: 0; bottom: -1px; height: 3px; width: 100%; background: transparent; }
    .progress span { display: block; height: 100%; width: 0; background: var(--accent); }
    .reader-bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      background: var(--surface); border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
      padding-bottom: env(safe-area-inset-bottom);
      transition: transform 0.2s ease;
    }
    .reader-bottom-inner { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; padding: 8px 12px; }
    .reader-bottom .btn { padding: 0 12px; }
    .chrome-hidden .reader-top { transform: translateY(-110%); }
    .chrome-hidden .reader-bottom { transform: translateY(110%); }
    .pages { max-width: 820px; margin: 0 auto; padding-top: var(--reader-top-h, calc(56px + env(safe-area-inset-top))); }
    .page { position: relative; background: var(--surface-2); min-height: 70vh; }
    .page.loaded { min-height: 0; background: transparent; }
    .page.loaded::after { display: none; }
    .page::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, var(--shimmer), transparent);
      transform: translateX(-100%); animation: shimmer 1.3s ease-in-out infinite;
    }
    .page img { width: 100%; height: auto; }
    .page-num { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; color: var(--muted); }
    .page.loaded .page-num { display: none; }
    .page-retry { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 10px; z-index: 1; }
    .page.failed::after { display: none; }
    .page.failed .page-retry { display: flex; }
    .page.failed img { display: none; }
    .chapter-end { max-width: 820px; margin: 0 auto; padding: 32px 16px; text-align: center; }
    .chapter-end h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; margin-bottom: 4px; }
    .chapter-end .btn { margin-top: 16px; }

    /* ---------- Dialog (chapter picker) ---------- */
    dialog.sheet {
      border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 80dvh;
      background: var(--surface); color: var(--text);
      border-radius: var(--radius-l) var(--radius-l) 0 0;
    }
    dialog.sheet::backdrop { background: var(--overlay); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
    .sheet-head h2 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; }
    .sheet-body { padding: 0 16px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; max-height: calc(80dvh - 61px); }

    .toast {
      position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px); z-index: 60;
      transform: translateX(-50%);
      background: var(--text); color: var(--bg);
      padding: 10px 16px; border-radius: var(--radius-m); font-size: 0.88rem; font-weight: 600;
      max-width: calc(100% - 32px);
    }

    /* ---------- Breakpoints ---------- */
    @media (min-width: 560px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 22px 14px; }
      .rail { grid-auto-columns: 132px; }
      .detail-hero { grid-template-columns: 160px minmax(0, 1fr); gap: 20px; }
      .detail-title { font-size: 1.7rem; }
      .detail-actions { grid-template-columns: minmax(0, max-content) auto; justify-content: start; }
      .chapter-tools { grid-template-columns: minmax(0, 280px) auto; justify-content: start; }
    }
    @media (min-width: 900px) {
      :root { --tabbar-h: 0px; }
      .tabbar { display: none; }
      .desktop-nav { display: flex; gap: 4px; margin-right: auto; margin-left: 24px; }
      .desktop-nav a { padding: 10px 14px; border-radius: var(--radius-m); font-weight: 600; color: var(--muted); }
      .desktop-nav a:hover { color: var(--text); background: var(--surface-2); }
      .desktop-nav a[aria-current="page"] { color: var(--text); background: var(--surface-2); }
      .brand { margin-right: 0; }
      main { padding-top: 28px; padding-bottom: 64px; }
      .page-title { font-size: 2rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 26px 18px; }
      .segmented { max-width: 420px; }
      .chip-row { flex-wrap: wrap; overflow: visible; margin: 0 0 20px; padding: 0; }
      .detail-hero { grid-template-columns: 200px minmax(0, 1fr); gap: 28px; }
      .rank-list { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 24px; }
      .toast { bottom: 24px; }
      dialog.sheet { margin: auto; border-radius: var(--radius-l); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  </svg>

  <a class="sr-only" href="#app">Lewati ke konten</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="KomikRoll, ke beranda">Komik<span>Roll</span></a>
      <nav class="desktop-nav" aria-label="Navigasi utama">
        <a href="#/" data-tab="home">Beranda</a>
        <a href="#/browse" data-tab="browse">Jelajah</a>
        <a href="#/top" data-tab="top">Populer</a>
        <a href="#/library" data-tab="library">Pustaka</a>
      </nav>
      <a class="icon-btn" href="#/search" aria-label="Cari komik" data-tab="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Tema: ikuti sistem"><svg class="icon" aria-hidden="true"><use href="#i-auto"/></svg></button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navigasi utama">
    <ul>
      <li><a class="tab" href="#/" data-tab="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Beranda</a></li>
      <li><a class="tab" href="#/browse" data-tab="browse"><svg class="icon" aria-hidden="true"><use href="#i-browse"/></svg>Jelajah</a></li>
      <li><a class="tab" href="#/top" data-tab="top"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>Populer</a></li>
      <li><a class="tab" href="#/library" data-tab="library"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg>Pustaka</a></li>
    </ul>
  </nav>

  <script>
    "use strict";
    const IMG_PROXY = "https://serveproxy.com/?url=";
    const NEWEST_PAGE_SIZE = 10;
    const LIST_PAGE_SIZE = 50;
    const CHAPTER_BATCH = 60;
    const TYPES = ["manga", "manhwa", "manhua"];
    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const app = document.getElementById("app");

    /* ---------------- Utilities ---------------- */
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const icon = (id) => `<svg class="icon" aria-hidden="true"><use href="#i-${id}"/></svg>`;

    const store = {
      get(key, fallback) {
        try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable: keep working without it */ }
      },
    };

    function cleanEp(ep) {
      if (!ep) return "";
      let v = String(ep).trim();
      if (/^https?:\/\//.test(v)) { try { v = new URL(v).pathname; } catch (e) {} }
      if (!v.startsWith("/")) v = "/" + v;
      if (!v.endsWith("/")) v += "/";
      return v;
    }
    const slugFromEp = (ep) => cleanEp(ep).replace(/^\/manga\//, "/").replace(/^\/|\/$/g, "");
    const comicSlugFromChapter = (ep) => cleanEp(ep).replace(/^\/(baca\/)?/, "").replace(/\/$/, "").replace(/-chapter-[\d.-]+$/i, "");
    const proxied = (url) => (!url ? "" : url.startsWith(IMG_PROXY) ? url : IMG_PROXY + url);
    const directOf = (url) => (url && url.startsWith(IMG_PROXY) ? url.slice(IMG_PROXY.length) : url || "");
    const chapterNum = (title) => { const m = String(title || "").match(/(\d+(?:\.\d+)?|\.\d+)/); return m ? parseFloat(m[1]) : null; };
    // Keep the source's own numbering ("Chapter .15" stays ".15"), only shorten the word.
    const shortChapter = (title) => { const t = String(title || "").trim(); return t ? t.replace(/^chapter\s*/i, "Ch. ") : "Chapter"; };
    const initials = (title) => String(title || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
    const typeLabel = (t) => { const v = String(t || "").toLowerCase(); return TYPES.includes(v) ? v[0].toUpperCase() + v.slice(1) : ""; };
    const comicHref = (slug, type) => `#/comic/${encodeURIComponent(slug)}${typeLabel(type) ? `?t=${String(type).toLowerCase()}` : ""}`;
    const readHref = (chEp, comicSlug) => `#/read?ep=${encodeURIComponent(cleanEp(chEp))}${comicSlug ? `&c=${encodeURIComponent(comicSlug)}` : ""}`;

    function timeAgo(ts) {
      const s = Math.max(1, Math.round((Date.now() - ts) / 1000));
      if (s < 60) return "baru saja";
      const m = Math.round(s / 60); if (m < 60) return `${m} menit lalu`;
      const h = Math.round(m / 60); if (h < 24) return `${h} jam lalu`;
      const d = Math.round(h / 24); if (d < 30) return `${d} hari lalu`;
      return new Date(ts).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
    }

    let toastTimer;
    function toast(msg) {
      let el = document.querySelector(".toast");
      if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
      el.textContent = msg; el.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
    }

    /* ---------------- API (cached, de-duplicated) ---------------- */
    const cache = new Map();
    function api(ep) {
      if (cache.has(ep)) return cache.get(ep);
      const p = fetch(`/api/proxy?ep=${encodeURIComponent(ep)}`)
        .then(async (res) => {
          let json = null;
          try { json = await res.json(); } catch (e) {}
          // The source API answers "no data" with 404; treat that as empty, not as a failure.
          if (res.status === 404 || (json && json.code === 404)) return { data: null, empty: true };
          if (!res.ok || !json) throw new Error(`Server membalas ${res.status}`);
          return json;
        })
        .catch((err) => { cache.delete(ep); throw err; });
      cache.set(ep, p);
      return p;
    }
    const listOf = (json) => (json && Array.isArray(json.data) ? json.data : []);

    /* ---------------- Local data: favorites & history ---------------- */
    const favs = () => store.get("kr:favs", {});
    const hist = () => store.get("kr:history", {});
    function toggleFav(comic) {
      const f = favs();
      if (f[comic.slug]) delete f[comic.slug];
      else f[comic.slug] = { title: comic.title, cover: comic.cover, type: comic.type, at: Date.now() };
      store.set("kr:favs", f);
      return !!f[comic.slug];
    }
    function recordRead(comic, chapter) {
      const h = hist();
      const prev = h[comic.slug] || { read: [] };
      const read = [chapter.ep, ...(prev.read || []).filter((e) => e !== chapter.ep)].slice(0, 400);
      h[comic.slug] = {
        title: comic.title || prev.title || comic.slug,
        cover: comic.cover || prev.cover || "",
        type: comic.type || prev.type || "",
        chapterEp: chapter.ep, chapterTitle: chapter.title, at: Date.now(), read,
      };
      store.set("kr:history", h);
    }

    /* ---------------- Theme ---------------- */
    const themeBtn = document.getElementById("themeBtn");
    const THEME_ORDER = ["system", "light", "dark"];
    const THEME_META = { system: ["auto", "ikuti sistem"], light: ["sun", "terang"], dark: ["moon", "gelap"] };
    function applyTheme(mode) {
      if (mode === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", mode);
      const [ic, label] = THEME_META[mode];
      themeBtn.innerHTML = icon(ic);
      themeBtn.setAttribute("aria-label", `Tema: ${label}. Ketuk untuk ganti`);
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
        if (mode === "system") m.setAttribute("content", m.media.includes("dark") ? "#121110" : "#F7F5F2");
        else m.setAttribute("content", bg);
      });
    }
    let themeMode = store.get("kr:theme", "system");
    if (!THEME_ORDER.includes(themeMode)) themeMode = "system";
    applyTheme(themeMode);
    themeBtn.addEventListener("click", () => {
      themeMode = THEME_ORDER[(THEME_ORDER.indexOf(themeMode) + 1) % THEME_ORDER.length];
      store.set("kr:theme", themeMode);
      applyTheme(themeMode);
      toast(`Tema ${THEME_META[themeMode][1]}`);
    });

    /* ---------------- Image load / error handling ---------------- */
    document.addEventListener("load", (e) => {
      const img = e.target;
      if (img.tagName !== "IMG") return;
      img.closest(".cover, .page")?.classList.add("loaded");
    }, true);
    document.addEventListener("error", (e) => {
      const img = e.target;
      if (img.tagName !== "IMG") return;
      // First failure: retry without the image proxy. Second failure: show the fallback.
      if (img.dataset.direct && !img.dataset.triedDirect) {
        img.dataset.triedDirect = "1";
        img.src = img.dataset.direct;
        return;
      }
      img.closest(".cover, .page")?.classList.add("failed");
    }, true);

    function coverHtml(url, title, { type = "", eager = false, w = 200 } = {}) {
      const tl = typeLabel(type);
      if (!url) {
        return `<div class="cover empty"><span class="cover-fallback" aria-hidden="true">${esc(initials(title))}</span>${tl ? `<span class="type-label">${tl}</span>` : ""}</div>`;
      }
      return `<div class="cover">
          <img src="${esc(proxied(url))}" data-direct="${esc(directOf(url))}" alt="Sampul ${esc(title)}" width="${w}" height="${Math.round(w * 1.5)}"
            referrerpolicy="no-referrer" ${eager ? 'fetchpriority="high"' : 'loading="lazy" decoding="async"'} />
          <span class="cover-fallback" aria-hidden="true">${esc(initials(title))}</span>
          ${tl ? `<span class="type-label">${tl}</span>` : ""}
        </div>`;
    }

    /* ---------------- Shared view pieces ---------------- */
    function comicCard(item, { showLatest = false, defaultType = "" } = {}) {
      const slug = slugFromEp(item.endpoint || item.slug);
      const title = item.title || slug;
      const type = item.type || defaultType;
      let latest = "";
      if (showLatest && Array.isArray(item.chapters) && item.chapters.length) {
        const ch = [...item.chapters].sort((a, b) => (chapterNum(b.title) ?? 0) - (chapterNum(a.title) ?? 0))[0];
        if (ch && ch.endpoint) latest = `<a class="chapter-chip" href="${readHref(ch.endpoint, slug)}" aria-label="Baca ${esc(ch.title)} ${esc(title)}">${esc(shortChapter(ch.title))}</a>`;
      }
      return `<article class="card">
          <a class="card-link" href="${comicHref(slug, type)}">
            ${coverHtml(item.image || item.cover || item.thumbnail, title, { type })}
            <span class="card-title">${esc(title)}</span>
          </a>
          ${latest}
        </article>`;
    }

    function skeletonGrid(n = 12) {
      return `<div class="grid" aria-hidden="true">${Array.from({ length: n }, () =>
        `<div class="card"><div class="sk sk-cover"></div><div class="sk sk-line" style="width:90%"></div><div class="sk sk-line" style="width:60%"></div></div>`).join("")}</div>`;
    }
    function skeletonList(n = 8) {
      return `<div aria-hidden="true">${Array.from({ length: n }, () =>
        `<div class="rank-item"><div class="sk" style="height:28px;width:28px;margin:auto"></div><div class="sk sk-cover" style="border-radius:6px"></div><div><div class="sk sk-line" style="width:80%"></div><div class="sk sk-line" style="width:40%"></div></div></div>`).join("")}</div>`;
    }
    const loadingLabel = (what) => `<p class="sr-only" role="status">Memuat ${esc(what)}…</p>`;

    function stateHtml({ title, body, actions = "" }) {
      return `<div class="state"><h2>${esc(title)}</h2><p>${esc(body)}</p>${actions}</div>`;
    }
    function errorState(err, what) {
      const offline = !navigator.onLine;
      return stateHtml({
        title: offline ? "Kamu sedang offline" : `Gagal memuat ${what}`,
        body: offline ? "Sambungkan internet, lalu coba lagi." : `Server sumber tidak merespons (${err.message}). Biasanya pulih dalam beberapa saat.`,
        actions: `<button class="btn btn-primary" type="button" data-action="retry">Coba lagi</button>`,
      });
    }

    /*
      Pagination: the API never returns a total page count, so the pager shows a window around the
      current page and checks whether the next page exists by prefetching it (which also makes Next instant).
    */
    function pagerHtml(page, hasNext, hrefFor) {
      const btn = (p, label, aria) => `<a class="page-btn" href="${hrefFor(p)}" ${aria ? `aria-label="${aria}"` : ""}>${label}</a>`;
      const parts = [];
      parts.push(page > 1 ? btn(page - 1, icon("back"), "Halaman sebelumnya") : `<span class="page-btn" aria-disabled="true" aria-label="Halaman sebelumnya">${icon("back")}</span>`);
      if (page > 2) parts.push(btn(1, "1", "Halaman 1"));
      if (page > 3) parts.push(`<span class="page-gap" aria-hidden="true">…</span>`);
      if (page > 1) parts.push(btn(page - 1, String(page - 1), `Halaman ${page - 1}`));
      parts.push(`<span class="page-btn" aria-current="page">${page}</span>`);
      if (hasNext) parts.push(btn(page + 1, String(page + 1), `Halaman ${page + 1}`));
      parts.push(hasNext ? btn(page + 1, icon("next"), "Halaman berikutnya") : `<span class="page-btn" aria-disabled="true" aria-label="Halaman berikutnya">${icon("next")}</span>`);
      if (!hasNext) parts.push(`<span class="page-label">Ini halaman terakhir</span>`);
      return `<nav class="pagination" aria-label="Pindah halaman">${parts.join("")}</nav>`;
    }
    function mountPager(container, page, itemsCount, pageSize, nextEp, hrefFor) {
      const optimistic = itemsCount >= pageSize;
      container.innerHTML = pagerHtml(page, optimistic, hrefFor);
      if (!optimistic) return;
      api(nextEp).then((json) => {
        if (!listOf(json).length && container.isConnected) container.innerHTML = pagerHtml(page, false, hrefFor);
      }).catch(() => {});
    }

    /* ---------------- Router ---------------- */
    let renderToken = 0;
    const scrollMemory = new Map();
    let readerCleanup = null;

    function parseHash() {
      const raw = location.hash.slice(1) || "/";
      const [path, qs] = raw.split("?");
      return { path, params: new URLSearchParams(qs || ""), key: raw };
    }
    function setTab(tab) {
      document.querySelectorAll("[data-tab]").forEach((el) => {
        if (el.dataset.tab === tab) el.setAttribute("aria-current", "page");
        else el.removeAttribute("aria-current");
      });
    }
    function setTitle(t) { document.title = t ? `${t} · KomikRoll` : "KomikRoll"; }

    // Links clicked inside the app start at the top; Back/Forward restore the previous position.
    document.addEventListener("click", (e) => {
      const a = e.target.closest('a[href^="#/"]');
      if (a) scrollMemory.delete(a.getAttribute("href").slice(1));
    });
    window.addEventListener("hashchange", (e) => {
      const oldKey = (new URL(e.oldURL).hash.slice(1)) || "/";
      scrollMemory.set(oldKey, window.scrollY);
      route();
    });

    /*
      Restore the saved position for Back/Forward only, and only until the user touches the page.
      Never force the page back to the top here: content that finishes loading while the user is
      already scrolling must not yank them upward.
    */
    let userScrolledSinceRoute = false;
    ["touchstart", "wheel", "keydown", "pointerdown"].forEach((ev) =>
      window.addEventListener(ev, () => { userScrolledSinceRoute = true; }, { passive: true }));
    function finishRender(token, key) {
      if (token !== renderToken || userScrolledSinceRoute) return;
      const y = scrollMemory.get(key);
      if (y > 0 && Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y);
    }

    async function route() {
      const { path, params, key } = parseHash();
      const token = ++renderToken;
      const seg = path.split("/").filter(Boolean).map(decodeURIComponent);
      if (readerCleanup) { readerCleanup(); readerCleanup = null; }
      document.body.classList.toggle("reading", seg[0] === "read");
      const tab = seg[0] || "home";
      setTab(["home", "browse", "top", "library", "search"].includes(tab) ? tab : "");
      window.scrollTo(0, 0);
      userScrolledSinceRoute = false;
      const ctx = { params, token, key };
      try {
        switch (seg[0]) {
          case undefined: await viewHome(ctx); break;
          case "browse": await viewBrowse(ctx); break;
          case "top": await viewTop(ctx); break;
          case "search": await viewSearch(ctx); break;
          case "library": await viewLibrary(ctx); break;
          case "comic": await viewDetail(ctx, seg[1] || ""); break;
          case "read": await viewReader(ctx); break;
          default:
            setTitle("Tidak ditemukan");
            app.innerHTML = stateHtml({ title: "Halaman tidak ditemukan", body: "Alamat ini tidak ada di KomikRoll.", actions: `<a class="btn btn-primary" href="#/">Ke beranda</a>` });
        }
      } catch (err) {
        if (token === renderToken) app.innerHTML = errorState(err, "halaman");
      }
    }
    app.addEventListener("click", (e) => {
      if (e.target.closest('[data-action="retry"]')) route();
    });

    /* ---------------- View: Home ---------------- */
    async function viewHome({ params, token, key }) {
      setTitle("");
      const page = Math.max(1, parseInt(params.get("page"), 10) || 1);
      const h = Object.entries(hist()).sort((a, b) => b[1].at - a[1].at).slice(0, 12);
      const continueHtml = page === 1 && h.length ? `
        <section class="section" aria-labelledby="cont-h">
          <div class="section-head"><h2 class="section-title" id="cont-h">Lanjut baca</h2><a class="text-link" href="#/library?tab=history">Semua riwayat</a></div>
          <div class="rail">${h.map(([slug, it]) => `
            <article class="card">
              <a class="card-link" href="${readHref(it.chapterEp, slug)}" aria-label="Lanjut baca ${esc(it.title)}, ${esc(it.chapterTitle)}">
                ${coverHtml(it.cover, it.title, { type: it.type })}
                <span class="card-title">${esc(it.title)}</span>
              </a>
              <span class="small muted">${esc(shortChapter(it.chapterTitle))}</span>
            </article>`).join("")}
          </div>
        </section>` : "";

      app.innerHTML = `
        <h1 class="sr-only">Beranda KomikRoll</h1>
        ${continueHtml}

    /* ---------------- Comic info normalization ---------------- */
    // The source API often shifts fields (type holds the Indonesian title, rating holds the status, etc.).
    function normalizeInfo(info, slug) {
      const rawType = String(info.type || "").trim();
      const rawRating = String(info.rating || info.score || "").trim();
      const rawStatus = String(info.status || "").trim();
      const rawAuthor = String(info.author || "").trim();
      const thumb = info.thumbnail || info.image || "";
      const STATUS = /^(ongoing|completed|hiatus|end|tamat)$/i;

      let type = typeLabel(rawType);
      let altTitle = info.alternative_title || "";
      if (!type) {
        if (rawType) altTitle = rawType;
        const m = thumb.split("/").pop().match(/[-_](Manga|Manhwa|Manhua)[-_.]/i);
        type = m ? typeLabel(m[1]) : "";
      }
      let status = "", theme = "", author = "";
      if (STATUS.test(rawRating)) { status = rawRating; theme = rawAuthor; }
      else {
        if (STATUS.test(rawStatus)) status = rawStatus;
        // rating usually carries the author name here; the real author field carries the theme.
        if (rawRating && !/^\d+(\.\d+)?$/.test(rawRating)) { author = rawRating; theme = rawAuthor; }
      }

      const genres = (Array.isArray(info.genre) ? info.genre : String(info.genre || "").split(","))
        .map((g) => String(g).trim()).filter(Boolean);
      const paragraphs = String(info.description || info.synopsis || "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
      const synopsis = [...new Set(paragraphs)].join("\n\n");
      const chapters = (info.chapter_list || info.chapters || []).map((c) => ({
        title: c.name || c.title || "", ep: cleanEp(c.endpoint || c.slug), date: c.date || c.time || "",
      })).filter((c) => c.ep !== "/");
      return { slug, title: info.title || slug, altTitle, type, status, theme, author, genres, synopsis, cover: thumb, chapters };
    }
    async function getComic(slug, typeHint = "") {
      const json = await api(`/comic/info/manga/${slug}/`);
      if (!json || !json.data) return null;
      const c = normalizeInfo(json.data, slug);
      if (!c.type && typeLabel(typeHint)) c.type = typeLabel(typeHint);
      return c;
    }

    /* ---------------- View: Detail ---------------- */
    async function viewDetail({ params, token, key }, slug) {
      setTitle("Memuat…");
      app.innerHTML = `${loadingLabel("detail komik")}

      let primary = "";
      if (h && h.chapterEp) primary = `<a class="btn btn-primary btn-block" href="${readHref(h.chapterEp, slug)}"><span>Lanjut ${esc(shortChapter(h.chapterTitle))}</span></a>`;
      else if (first) primary = `<a class="btn btn-primary btn-block" href="${readHref(first.ep, slug)}"><span>Mulai baca ${esc(shortChapter(first.title))}</span></a>`;
      else primary = `<button class="btn btn-block" type="button" disabled>Belum ada chapter</button>`;
      const isFav = !!favs()[slug];

      app.innerHTML = `
        <div class="detail-hero">
          ${coverHtml(comic.cover, comic.title, { eager: true, w: 200 })}
          <div>
            <h1 class="detail-title">${esc(comic.title)}</h1>
            ${comic.altTitle ? `<p class="alt-title">${esc(comic.altTitle)}</p>` : ""}
            ${comic.author ? `<p class="alt-title">oleh ${esc(comic.author)}</p>` : ""}
            <div class="tag-row detail-meta">
              ${comic.type ? `<span class="tag">${esc(comic.type)}</span>` : ""}
              ${comic.status ? `<span class="tag">${esc(comic.status)}</span>` : ""}
              ${comic.theme ? `<span class="tag">${esc(comic.theme)}</span>` : ""}

        <div class="detail-actions">
          ${primary}
          <button class="btn" type="button" id="favBtn" aria-pressed="${isFav}">${icon("bookmark")}<span>${isFav ? "Tersimpan" : "Simpan"}</span></button>
        </div>
        ${comic.synopsis ? `<section class="section" aria-labelledby="syn-h">
          <h2 class="sr-only" id="syn-h">Sinopsis</h2>
          <p class="synopsis clamped" id="synopsis">${esc(comic.synopsis)}</p>
          <button class="text-link" type="button" id="synToggle" aria-expanded="false" aria-controls="synopsis" hidden style="background:none;border:0">Selengkapnya</button>
          ${comic.genres.length ? `<div class="tag-row genres" aria-label="Genre">${comic.genres.map((g) => `<span class="tag">${esc(g)}</span>`).join("")}</div>` : ""}
        </section>` : ""}
        <section class="section" aria-labelledby="ch-h">
          <div class="section-head"><h2 class="section-title" id="ch-h">Daftar chapter</h2></div>
          ${comic.chapters.length ? `
            <div class="chapter-tools">
              <div><label class="sr-only" for="chFilter">Cari nomor chapter</label>
                <input class="input plain" id="chFilter" type="search" inputmode="decimal" placeholder="Cari nomor chapter" autocomplete="off" /></div>
              <button class="btn" type="button" id="chSort" aria-label="Urutan: terbaru dulu">${icon("sort")}<span>Terbaru</span></button>
            </div>
            <ul class="chapter-list" id="chList"></ul>
            <div id="chMore"></div>`
          : stateHtml({ title: "Belum ada chapter", body: "Sumber belum menyediakan chapter untuk judul ini." })}
        </section>`;

      // Synopsis expand
      const syn = document.getElementById("synopsis");
      const synBtn = document.getElementById("synToggle");
      if (syn && synBtn && syn.scrollHeight > syn.clientHeight + 4) {
        synBtn.hidden = false;
        synBtn.addEventListener("click", () => {
          const open = syn.classList.toggle("clamped") === false;
          synBtn.textContent = open ? "Ringkas" : "Selengkapnya";
          synBtn.setAttribute("aria-expanded", String(open));
        });
      }
      // Favorite toggle
      document.getElementById("favBtn").addEventListener("click", (e) => {
        const on = toggleFav(comic);

        toast(on ? "Disimpan ke Pustaka" : "Dihapus dari Pustaka");
      });

      // Chapter list: filter, sort, incremental render
      if (comic.chapters.length) {
        let newestFirst = true, shown = CHAPTER_BATCH;
        const listEl = document.getElementById("chList");
        const moreEl = document.getElementById("chMore");
        const filterEl = document.getElementById("chFilter");
        const sortBtn = document.getElementById("chSort");
        const renderChapters = () => {
          const q = filterEl.value.trim();
          let list = newestFirst ? comic.chapters : [...comic.chapters].reverse();
          if (q) {
            // Numbers match by prefix ("5" finds 5, 50-59), anything else matches the title text.
            list = /^\d+([.,]\d*)?$/.test(q)
              ? list.filter((c) => chapterNum(c.title) !== null && String(chapterNum(c.title)).startsWith(q.replace(",", ".")))
              : list.filter((c) => c.title.toLowerCase().includes(q.toLowerCase()));

            const isCurrent = h && h.chapterEp === c.ep;
            const isRead = readSet.has(c.ep);
            return `<li><a class="chapter-row ${isRead ? "read" : ""} ${isCurrent ? "current" : ""}" href="${readHref(c.ep, slug)}">

                <span class="ch-state">${isCurrent ? "Terakhir dibaca" : isRead ? "Sudah dibaca" : esc(c.date)}</span>
              </a></li>`;
          }).join("");
          const rest = list.length - shown;
          moreEl.innerHTML = rest > 0 ? `<button class="btn btn-block" type="button" style="margin-top:12px">Tampilkan ${Math.min(rest, CHAPTER_BATCH)} lagi (sisa ${rest})</button>` : "";
          moreEl.querySelector("button")?.addEventListener("click", () => { shown += CHAPTER_BATCH; renderChapters(); });
        };
        filterEl.addEventListener("input", () => { shown = CHAPTER_BATCH; renderChapters(); });
        sortBtn.addEventListener("click", () => {
          newestFirst = !newestFirst; shown = CHAPTER_BATCH;
          sortBtn.querySelector("span").textContent = newestFirst ? "Terbaru" : "Terlama";
          sortBtn.setAttribute("aria-label", `Urutan: ${newestFirst ? "terbaru" : "terlama"} dulu`);
          renderChapters();
        });
        renderChapters();
      }
      finishRender(token, key);
    }

    /* ---------------- View: Reader ---------------- */
    async function fetchChapter(ep) {
      let json = await api(`/comic/chapter${ep}`);
      if (!json || !json.data || !Array.isArray(json.data.image) || !json.data.image.length) {
        const fb = ep.startsWith("/baca/") ? ep.replace(/^\/baca/, "") : `/baca${ep}`;
        const alt = await api(`/comic/chapter${fb}`);
        if (alt && alt.data && Array.isArray(alt.data.image) && alt.data.image.length) json = alt;
      }
      if (!json || !json.data || !Array.isArray(json.data.image)) return null;
      const images = json.data.image.map((raw) => (typeof raw === "string" ? raw : raw.url || raw.image || "")).filter(Boolean);
      return { title: json.data.title || "", images };
    }

          <div class="reader-heading"><p class="comic-name">&nbsp;</p><h1>Memuat chapter…</h1></div>
        </div><div class="progress" aria-hidden="true"><span></span></div></header>
        <div class="pages" aria-busy="true">${loadingLabel("halaman chapter")}<div class="page" aria-hidden="true"></div></div>`;

      const [chapRes, comicRes] = await Promise.allSettled([fetchChapter(ep), getComic(slug)]);
      if (token !== renderToken) return;
      const comic = comicRes.status === "fulfilled" ? comicRes.value : null;
      if (chapRes.status === "rejected" || !chapRes.value || !chapRes.value.images.length) {
        const err = chapRes.status === "rejected" ? chapRes.reason : null;
        app.innerHTML = `<div style="padding:24px 16px; max-width:640px; margin:0 auto">${err ? errorState(err, "chapter") :
          stateHtml({ title: "Chapter tidak bisa dibuka", body: "Gambar chapter ini tidak tersedia di sumber.", actions: `<a class="btn btn-primary" href="${comicHref(slug)}">Kembali ke daftar chapter</a>` })}</div>`;
        return;
      }
      const chap = chapRes.value;
      const list = comic ? comic.chapters : [];
      const idx = list.findIndex((c) => c.ep === ep || c.ep.replace(/^\/baca/, "") === ep.replace(/^\/baca/, ""));
      const cur = idx >= 0 ? list[idx] : { title: chap.title || "Chapter", ep };
      const prev = idx >= 0 ? list[idx + 1] : null;   // list is newest first
      const next = idx > 0 ? list[idx - 1] : null;
      const comicTitle = comic ? comic.title : slug.replace(/-/g, " ");
      setTitle(`${shortChapter(cur.title)} · ${comicTitle}`);
      recordRead({ slug, title: comic?.title, cover: comic?.cover, type: comic?.type }, { ep: cur.ep, title: cur.title });

      const navBtn = (c, dir) => c
        ? `<a class="btn" href="${readHref(c.ep, slug)}" aria-label="${dir === "prev" ? "Chapter sebelumnya" : "Chapter berikutnya"}: ${esc(c.title)}">${dir === "prev" ? icon("back") : ""}<span>${dir === "prev" ? "Seb." : "Lanjut"}</span>${dir === "next" ? icon("next") : ""}</a>`
        : `<button class="btn" type="button" disabled aria-label="${dir === "prev" ? "Tidak ada chapter sebelumnya" : "Belum ada chapter berikutnya"}">${dir === "prev" ? icon("back") : ""}<span>${dir === "prev" ? "Seb." : "Lanjut"}</span>${dir === "next" ? icon("next") : ""}</button>`;

      app.innerHTML = `
        <header class="reader-top"><div class="reader-top-inner">
          <a class="icon-btn" href="${comicHref(slug, comic?.type)}" aria-label="Kembali ke ${esc(comicTitle)}">${icon("back")}</a>
          <div class="reader-heading"><p class="comic-name">${esc(comicTitle)}</p><h1>${esc(cur.title)}</h1></div>
          <span class="small muted" id="pageCounter" aria-live="off" style="padding:0 8px;white-space:nowrap">1/${chap.images.length}</span>
        </div><div class="progress" aria-hidden="true"><span id="progressBar"></span></div></header>
        <div class="pages" id="pages">
          ${chap.images.map((url, i) => `
            <figure class="page">
              <span class="page-num" aria-hidden="true">${i + 1}</span>
              <img src="${esc(proxied(url))}" data-direct="${esc(directOf(url))}" alt="Halaman ${i + 1}" referrerpolicy="no-referrer"
                ${i < 2 ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" />
              <div class="page-retry"><p class="small muted">Halaman ${i + 1} gagal dimuat</p><button class="btn" type="button" data-retry>Muat ulang</button></div>
            </figure>`).join("")}
        </div>
        <section class="chapter-end" aria-labelledby="end-h">
          <h2 id="end-h">Selesai: ${esc(cur.title)}</h2>
          <p class="muted small">${next ? `Berikutnya: ${esc(next.title)}` : "Ini chapter terbaru yang tersedia."}</p>
          ${next ? `<a class="btn btn-primary btn-block" style="max-width:360px" href="${readHref(next.ep, slug)}"><span>Baca ${esc(shortChapter(next.title))}</span></a>`
                 : `<a class="btn btn-block" style="max-width:360px" href="${comicHref(slug, comic?.type)}">Kembali ke daftar chapter</a>`}
        </section>
        <nav class="reader-bottom" aria-label="Navigasi chapter"><div class="reader-bottom-inner">
          ${navBtn(prev, "prev")}
          <button class="btn" type="button" id="pickChapter" ${list.length ? "" : "disabled"} aria-haspopup="dialog">${icon("list")}<span>${esc(shortChapter(cur.title))}</span></button>
          ${navBtn(next, "next")}
        </div></nav>
        <dialog class="sheet" id="chapterSheet" aria-labelledby="sheet-h">
          <div class="sheet-head"><h2 id="sheet-h">Pilih chapter</h2>
            <button class="icon-btn" type="button" id="closeSheet" aria-label="Tutup">${icon("close")}</button></div>
          <div class="sheet-body"><ul class="chapter-list">
            ${list.map((c) => `<li><a class="chapter-row ${c.ep === cur.ep ? "current" : ""}" href="${readHref(c.ep, slug)}" ${c.ep === cur.ep ? 'aria-current="true"' : ""}>
              <span class="ch-name">${esc(c.title)}</span><span class="ch-state">${c.ep === cur.ep ? "Sedang dibaca" : ""}</span></a></li>`).join("")}
          </ul></div>
        </dialog>`;

      // Long titles wrap to two lines, so the first page starts below the header's real height.
      const topBar = app.querySelector(".reader-top");
      const syncTopHeight = () => document.documentElement.style.setProperty("--reader-top-h", `${topBar.offsetHeight}px`);
      syncTopHeight();
      const topObserver = new ResizeObserver(syncTopHeight);
      topObserver.observe(topBar);

      // Retry a failed page
      document.getElementById("pages").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-retry]");
        if (!btn) return;
        const fig = btn.closest(".page");
        const img = fig.querySelector("img");
        fig.classList.remove("failed");
        delete img.dataset.triedDirect;
        const base = proxied(img.dataset.direct);
        img.src = base + (base.includes("?") ? "&" : "?") + "r=" + Date.now();
      });

      // Chapter picker
      const sheet = document.getElementById("chapterSheet");
      document.getElementById("pickChapter").addEventListener("click", () => {
        sheet.showModal();
        sheet.querySelector('[aria-current="true"]')?.scrollIntoView({ block: "center" });
      });
      document.getElementById("closeSheet").addEventListener("click", () => sheet.close());
      sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
      sheet.addEventListener("click", (e) => { if (e.target.closest("a")) sheet.close(); });

      // Auto-hide controls while scrolling down, show on scroll up or tap.
      const bar = document.getElementById("progressBar");
      const counter = document.getElementById("pageCounter");
      const figures = [...document.querySelectorAll("#pages .page")];
      let lastY = window.scrollY, ticking = false;
      const onScroll = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          const y = window.scrollY;
          const max = document.documentElement.scrollHeight - innerHeight;
          bar.style.width = `${max > 0 ? Math.min(100, (y / max) * 100) : 0}%`;
          if (y > lastY + 10 && y > 120) document.body.classList.add("chrome-hidden");
          else if (y < lastY - 10 || y + innerHeight >= document.documentElement.scrollHeight - 40) document.body.classList.remove("chrome-hidden");
          lastY = y;
          const mid = innerHeight / 2;
          let current = 1;
          for (let i = 0; i < figures.length; i++) { if (figures[i].getBoundingClientRect().top < mid) current = i + 1; else break; }
          counter.textContent = `${current}/${figures.length}`;
          ticking = false;
        });
      };
      const onTap = (e) => { if (e.target.closest("#pages") && !e.target.closest("button")) document.body.classList.toggle("chrome-hidden"); };
      const onKey = (e) => {
        if (sheet.open || e.target.closest("input, textarea")) return;
        if (e.key === "ArrowRight" && next) location.hash = readHref(next.ep, slug).slice(1);
        if (e.key === "ArrowLeft" && prev) location.hash = readHref(prev.ep, slug).slice(1);
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      document.addEventListener("click", onTap);
      document.addEventListener("keydown", onKey);
      readerCleanup = () => {
        window.removeEventListener("scroll", onScroll);
        document.removeEventListener("click", onTap);
        document.removeEventListener("keydown", onKey);
        document.body.classList.remove("chrome-hidden");
        topObserver.disconnect();
      };

      // Warm the next chapter so "Lanjut" opens instantly.
      if (next) setTimeout(() => fetchChapter(next.ep).catch(() => {}), 1500);
    }

    route();
  </script>
</body>
</html>
